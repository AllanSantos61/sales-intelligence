name: Python ETL tests
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.generate_data
      - run: python -m src.etl
      - run: python -m src.build_dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: sales-dashboard-data
          path: docs/dashboard/data.json
      - name: Commit generated dashboard data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/dashboard/data.json
          git diff --cached --quiet || (git commit -m "chore: refresh synthetic dashboard data [skip ci]" && git push)
